{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chess</title>
    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            width: 480px;
        }

        .cell {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
        }

        .white {
            background-color: #eee;
        }

        .black {
            background-color: #666;
        }
    </style>
</head>
<body>
<div id="game-result" style="display:none; font-size: 24px; margin-top: 10px;"></div>


<button onclick="loadGames()">Показать партии</button>

<button onclick="newGame()">Новая игра</button>

<button onclick="copyLink()">Пригласить друга</button>

<div id="games"></div>
<div id="board"></div>
<div id="time-setup">
    <h3>Введите длительность игры (в секундах)</h3>
    <input type="number" id="time-input" min="10" placeholder="например 600">
    <button id="set-time-btn">Начать</button>
</div>

<div id="board-container" style="display:none;">
   
    <div id="timers">
        <div>Белые: <span id="white-timer">0:00</span></div>
        <div>Чёрные: <span id="black-timer">0:00</span></div>
    </div>
</div>

<button onclick="loadReplay(gameId)">Просмотреть партию</button>

<button onclick="goToReplay()">Реплей</button>

<script src="{% static 'game/script.js' %}"></script>
<script src="{% static 'game/replay.js' %}"></script>

</body>
</html>
